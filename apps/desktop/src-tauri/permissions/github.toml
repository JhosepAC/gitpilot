[[permission]]
identifier = "allow-github-account"
description = "Authorize the registered GitHub App, verify the account and use the OS credential store"
commands.allow = ["github_account", "github_session", "github_start", "github_poll", "github_cancel", "github_check", "github_installations", "github_repositories", "github_open_verification", "github_disconnect", "github_open_authorizations", "github_revocation_reviewed"]

[[permission]]
identifier = "allow-github-repository-activity"
description = "Read authorized GitHub activity and review associations with local remotes"
commands.allow = ["github_repository_activity", "github_remote_candidates", "github_link_remote", "github_unlink_remote"]
