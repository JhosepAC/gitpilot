name: Verify published Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version without the v prefix
        required: true
        default: '1.1.0'
        type: string

permissions:
  contents: read

jobs:
  installation:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}
      - name: Download and authenticate public packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $env:PATH = (Join-Path $env:ProgramFiles 'Git\usr\bin') + ';' + $env:PATH
          $public = Join-Path $env:RUNNER_TEMP 'public-release'
          New-Item -ItemType Directory -Path $public | Out-Null
          gh release download "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --dir $public
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public release.' }
          $keyring = Join-Path $env:RUNNER_TEMP 'verify-keyring'
          New-Item -ItemType Directory -Path $keyring | Out-Null
          gpg --homedir $keyring --batch --import (Join-Path $public 'GitPilot-release-key.asc')
          if ($LASTEXITCODE -ne 0) { throw 'Could not import public distribution key.' }
          $status = gpg --homedir $keyring --batch --status-fd 1 --verify (Join-Path $public 'SHA256SUMS.txt.asc') (Join-Path $public 'SHA256SUMS.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Invalid public release signature.' }
          $valid = @($status | Where-Object { $_ -match '^\[GNUPG:\] VALIDSIG ' })
          if ($valid.Count -ne 1) { throw 'Expected one valid manifest signature.' }
          $fields = $valid[0] -split ' '
          $fingerprint = '47B10C26AF8BC9615DE39C5813EF6F27474B5E0F'
          if ($fields[2] -ne $fingerprint -and $fields[-1] -ne $fingerprint) { throw 'Unexpected distribution signer.' }
          $expected = @("GitPilot_$($env:VERSION)_x64-setup.exe", "GitPilot_$($env:VERSION)_amd64.deb", 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.txt', 'BUILD-INFO.txt')
          $seen = @()
          foreach ($line in Get-Content -LiteralPath (Join-Path $public 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-f0-9]{64})  ([^/\\]+)$') { throw 'Malformed checksum manifest.' }
            $digest, $name = $Matches[1], $Matches[2]
            if ($name -notin $expected -or $name -in $seen) { throw 'Unexpected or repeated manifest entry.' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $public $name)).Hash -ne $digest) { throw "Checksum mismatch: $name" }
            $seen += $name
          }
          if ($seen.Count -ne $expected.Count) { throw 'Incomplete checksum manifest.' }
          $info = Get-Content -Raw -LiteralPath (Join-Path $public 'BUILD-INFO.txt') | ConvertFrom-StringData
          if ($info.version -ne $env:VERSION -or $info.commit -ne (git rev-parse HEAD)) { throw 'Release provenance does not match the tag.' }
          "PUBLIC_INSTALLER=$(Join-Path $public "GitPilot_$($env:VERSION)_x64-setup.exe")" >> $env:GITHUB_ENV
      - name: Test public Windows installer and upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-windows-installer.ps1 -Installer $env:PUBLIC_INSTALLER
